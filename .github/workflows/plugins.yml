name: Plugins

# Manual only. To run on push/PR later, add `push:` / `pull_request:` triggers here.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which plugin to build
        type: choice
        options: [all, intellij, vscode]
        default: all

permissions:
  contents: read

jobs:
  intellij:
    if: inputs.target == 'all' || inputs.target == 'intellij'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intellij-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle buildPlugin
      - run: gradle verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: take-break-intellij
          path: intellij-plugin/build/distributions/*.zip

  vscode:
    if: inputs.target == 'all' || inputs.target == 'vscode'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: take-break-vscode
          path: vscode-extension/*.vsix
